name: Deploy Coronation Website, Frontend

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_DIR: ${{ github.ref_name == 'main' && '/var/www/production/Coronation-Frontend' || '/var/www/staging/Coronation-Frontend' }}
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.PROD_SERVER_HOST }}
          username: ${{ vars.PROD_SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_BRANCH
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22

            cd "$DEPLOY_DIR"

            git fetch origin
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd

            npm ci
            npm run build

            sudo systemctl reload nginx